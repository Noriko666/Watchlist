location = /watchlist {
    return 301 /watchlist/;
}

location ^~ /watchlist/.env {
    return 404;
}

location ^~ /watchlist/.git/ {
    return 404;
}

location ^~ /watchlist/data/ {
    return 404;
}

location ^~ /watchlist/_backup {
    return 404;
}

location ^~ /watchlist/backend/ {
    return 404;
}

location ^~ /watchlist/src/ {
    return 404;
}

location ^~ /watchlist/node_modules/ {
    return 404;
}

location = /watchlist/package.json {
    return 404;
}

location = /watchlist/package-lock.json {
    return 404;
}

location = /watchlist/yarn.lock {
    return 404;
}

location ^~ /watchlist/ {
    proxy_pass http://127.0.0.1:4310/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
